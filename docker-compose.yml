# docker-compose.yml
version: '3.8'

services:
  summarizer:
    build: .
    network_mode: host  # ホストのネットワークを使用
    #ports:
    #  - "8501:8501"
    volumes:
      - .:/app              # ルートディレクトリ全体をマウント
      #- ./src:/app/src
      #- .env:/app/.env  # 後で追加
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"  # ホストのIPを解決
    
  test:
    build: .
    network_mode: host  # summarizerと同じ設定にしておく
    volumes:
      - .:/app
    working_dir: /app
    command: |
      sh -c "
        pip install --no-cache-dir -r requirements-dev.txt &&
        pytest
      "